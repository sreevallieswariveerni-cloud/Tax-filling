
<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Ledgerly</title>
    <link rel="icon" type="image/png" sizes="184x184" href="images/logo_transparent_image.png">
        <!-- <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/signup.css">

    <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body class="auth-page signup-page">

    <main class="auth-layout">
        <div class="auth-decoration auth-decoration-one"></div>
        <div class="auth-decoration auth-decoration-two"></div>

        <div class="auth-tools">
    <button type="button" class="auth-tool-button theme-toggle" aria-label="Toggle dark mode">
        <i data-lucide="moon"></i>
    </button>

    <button type="button" class="auth-tool-button rtl-toggle" aria-label="Toggle text direction">
        <i data-lucide="arrow-left-right"></i>
    </button>
</div>

        <section class="auth-card signup-card">
            <a href="index.html" class="auth-brand">
                <img src="images/logo_transparent_image.png" alt="Ledgerly logo">
                <span class="auth-brand-name">Ledger<span>ly</span></span>
            </a>

            <header class="auth-heading">
                <p class="auth-eyebrow">LEDGERLY CLIENT PORTAL</p>
                <h1>Create <em>Account</em></h1>
                <p>Set up your account to manage documents and tax filings.</p>
            </header>

            <form id="signup-form">
                <div class="signup-grid">
                    <label class="auth-field">
                        <span>Full Name</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="user-round"></i>
                            <input type="text" name="fullname" placeholder="Enter your full name" autocomplete="name" required>
                        </span>
                    </label>

                    <label class="auth-field">
                        <span>Email Address</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="mail"></i>
                            <input type="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
                        </span>
                    </label>

                    <label class="auth-field">
                        <span>Phone Number</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="phone"></i>
                            <input type="tel" name="phone" placeholder="Enter your phone number" autocomplete="tel" pattern="[0-9+() -]{7,18}" required>
                        </span>
                    </label>

                    <label class="auth-field">
                        <span>City</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="map-pin"></i>
                            <input type="text" name="city" placeholder="Enter your city" autocomplete="address-level2" required>
                        </span>
                    </label>

                    <label class="auth-field">
                        <span>Create Password</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="lock-keyhole"></i>
                            <input type="password" id="signup-password" name="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="auth-password-toggle" data-password-target="signup-password" aria-label="Show password">
                                <i data-lucide="eye"></i>
                            </button>
                        </span>
                    </label>

                    <label class="auth-field">
                        <span>Confirm Password</span>
                        <span class="auth-input-wrap">
                            <i data-lucide="shield-check"></i>
                            <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
                            <button type="button" class="auth-password-toggle" data-password-target="confirm-password" aria-label="Show password">
                                <i data-lucide="eye"></i>
                            </button>
                        </span>
                    </label>
                </div>

                <label class="auth-terms">
                    <input type="checkbox" name="terms" required>
                    <span>I agree to the <a href="terms.html">Terms &amp; Conditions</a> and <a href="privacy.html">Privacy Policy</a>.</span>
                </label>

                <button type="submit" class="auth-submit">
                    Create Account <i data-lucide="user-round-plus"></i>
                </button>

                <p class="auth-message" id="signup-message" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
            </p>

            <p class="auth-legal">© 2026 Ledgerly. All rights reserved.</p>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
